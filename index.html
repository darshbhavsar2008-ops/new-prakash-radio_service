<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Prakash Radio Service | Virtual Shop</title>
    
    <!-- Clean, modern fonts for UI and textures -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            margin: 0; padding: 0;
            background-color: #87CEEB; /* Sky blue base */
            overflow-x: hidden;
            overscroll-behavior-y: none;
            font-family: 'Inter', sans-serif;
        }

        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #scroll-proxy {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 1500vh; /* Extremely long scroll for smooth pacing */
            z-index: 10;
        }

        /* Clean Glass UI Overlay */
        #ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            box-sizing: border-box;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            color: #333;
        }

        .scroll-indicator {
            width: 30px; height: 50px;
            border: 2px solid #333;
            border-radius: 15px;
            position: relative;
            margin: 0 auto;
        }
        .scroll-dot {
            width: 6px; height: 6px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            animation: scroll-anim 2s infinite ease-in-out;
        }
        @keyframes scroll-anim {
            0% { top: 8px; opacity: 1; }
            100% { top: 32px; opacity: 0; }
        }

        /* Progress Bar */
        #progress-container {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw; height: 4px;
            background: rgba(255,255,255,0.3);
            z-index: 60;
        }
        #progress-bar {
            height: 100%; width: 0%;
            background: #2563eb;
            transition: width 0.1s;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="flex justify-between items-start w-full">
            <div class="glass-panel" id="header-panel">
                <h1 class="font-serif text-2xl font-bold text-gray-900">New Prakash Radio Service</h1>
                <p class="text-sm text-gray-600 mt-1">Est. Idar, Gujarat</p>
            </div>
            <div class="glass-panel text-right opacity-0 transition-opacity duration-500" id="context-panel">
                <p class="font-semibold text-gray-800" id="context-title">Location</p>
                <p class="text-sm text-gray-600" id="context-desc">Turanga Circle</p>
            </div>
        </div>

        <div class="w-full text-center pb-8" id="scroll-prompt">
            <div class="scroll-indicator mb-3"><div class="scroll-dot"></div></div>
            <p class="text-sm font-medium text-gray-800 tracking-wide uppercase shadow-sm">Scroll to Explore</p>
        </div>
    </div>

    <!-- Progress Bar -->
    <div id="progress-container"><div id="progress-bar"></div></div>

    <!-- Scroll Proxy -->
    <div id="scroll-proxy"></div>

    <!-- WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- GSAP Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Main Application Logic -->
    <script type="module">
        import * as THREE from 'three';

        // ==========================================================
        // 1. SETUP & RENDERER
        // ==========================================================
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        // Light blue sky background
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 50, 400); // Realistic atmospheric perspective

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Realistic Lighting setup
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        const floaters = []; // For ambient animations

        // ==========================================================
        // 2. PROCEDURAL TEXTURE GENERATORS (Canvas API)
        // ==========================================================
        
        // Generates high-res text layouts for the Business Card
        function createCardTexture(isFront) {
            const cvs = document.createElement('canvas');
            cvs.width = 2048; cvs.height = 1024;
            const ctx = cvs.getContext('2d');
            
            // Base paper texture (slight off-white)
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, cvs.width, cvs.height);
            
            // Subtle paper noise
            for(let i=0; i<10000; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.03})`;
                ctx.fillRect(Math.random()*cvs.width, Math.random()*cvs.height, 2, 2);
            }

            // Design accents
            ctx.fillStyle = '#0f172a'; // Deep slate blue
            ctx.fillRect(0, 0, 40, cvs.height); // Left border
            ctx.fillRect(cvs.width - 40, 0, 40, cvs.height); // Right border

            ctx.textAlign = 'center';
            ctx.fillStyle = '#1e293b';

            if (isFront) {
                // Front Design
                ctx.font = 'bold 120px "Playfair Display", serif';
                ctx.fillText('NEW PRAKASH', cvs.width/2, 350);
                
                ctx.font = 'bold 90px Inter, sans-serif';
                ctx.fillStyle = '#2563eb'; // Blue accent
                ctx.fillText('RADIO SERVICE', cvs.width/2, 480);

                ctx.fillStyle = '#475569';
                ctx.font = '40px Inter, sans-serif';
                ctx.fillText('ELECTRONICS • HOME APPLIANCES • MOBILES', cvs.width/2, 600);
                
                ctx.font = 'italic 45px "Playfair Display", serif';
                ctx.fillText('Idar, Turanga Circle, Near Petrol Pump', cvs.width/2, 800);
            } else {
                // Back Design
                ctx.font = 'bold 80px Inter, sans-serif';
                ctx.fillText('AUTHORIZED RETAILER', cvs.width/2, 200);
                
                ctx.textAlign = 'left';
                ctx.font = '50px Inter, sans-serif';
                ctx.fillStyle = '#334155';
                const items = [
                    '✓ Smart TVs & LED Displays',
                    '✓ Air Conditioners & Coolers',
                    '✓ Home Theater & Speakers',
                    '✓ Smartphones & Smartwatches',
                    '✓ All Electronic Accessories'
                ];
                items.forEach((item, i) => {
                    ctx.fillText(item, 500, 400 + (i * 100));
                });
            }

            const tex = new THREE.CanvasTexture(cvs);
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        // Generates Checkered Floor Texture
        function createFloorTexture() {
            const cvs = document.createElement('canvas');
            cvs.width = 1024; cvs.height = 1024;
            const ctx = cvs.getContext('2d');
            
            const tileSize = 256;
            for(let y=0; y<cvs.height; y+=tileSize) {
                for(let x=0; x<cvs.width; x+=tileSize) {
                    const isWhite = (x/tileSize + y/tileSize) % 2 === 0;
                    ctx.fillStyle = isWhite ? '#f0f0f0' : '#d0d0d0'; // Off-white and light gray tiles
                    ctx.fillRect(x, y, tileSize, tileSize);
                }
            }
            
            const tex = new THREE.CanvasTexture(cvs);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(10, 40); // Repeat over the long floor
            tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
            return tex;
        }

        // Generates gradient textures for TV screens
        function createScreenTexture(color1, color2) {
            const cvs = document.createElement('canvas');
            cvs.width = 1024; cvs.height = 512;
            const ctx = cvs.getContext('2d');
            
            const grad = ctx.createLinearGradient(0,0, cvs.width, cvs.height);
            grad.addColorStop(0, color1);
            grad.addColorStop(1, color2);
            ctx.fillStyle = grad;
            ctx.fillRect(0,0, cvs.width, cvs.height);
            
            // Draw some abstract UI/Picture elements
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.arc(300, 256, 150, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(700, 150, 80, 0, Math.PI*2); ctx.fill();

            const tex = new THREE.CanvasTexture(cvs);
            return tex;
        }

        // Very basic procedural earth texture
        function createEarthTexture() {
            const cvs = document.createElement('canvas');
            cvs.width = 1024; cvs.height = 512;
            const ctx = cvs.getContext('2d');
            
            // Ocean
            ctx.fillStyle = '#1e3a8a'; 
            ctx.fillRect(0, 0, cvs.width, cvs.height);
            
            // Fake continents via random arcs (abstract but colorful)
            ctx.fillStyle = '#22c55e'; // Green
            for(let i=0; i<60; i++) {
                ctx.beginPath();
                const x = Math.random() * cvs.width;
                const y = Math.random() * cvs.height;
                const r = 20 + Math.random() * 60;
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
            }
            // Desert highlights
            ctx.fillStyle = '#d97706'; 
            for(let i=0; i<30; i++) {
                ctx.beginPath();
                ctx.arc(Math.random()*cvs.width, Math.random()*cvs.height, 30, 0, Math.PI*2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(cvs);
        }

        // ==========================================================
        // 3. SCENE CONSTRUCTION (Physical Z-Axis Layout)
        // ==========================================================
        
        // --- COMMON MATERIALS ---
        const matWood = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.9, metalness: 0.1 });
        const matPlasticBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.5 });
        const matPlasticWhite = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.2, metalness: 0.1 });
        const matGlass = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, transmission: 0.9, opacity: 1, metalness: 0, roughness: 0.05, ior: 1.5, thickness: 0.5
        });

        // ----------------------------------------------------------
        // ZONE 1: THE EARTH (z = 100)
        // ----------------------------------------------------------
        const earthGroup = new THREE.Group();
        earthGroup.position.set(0, 0, 100);
        scene.add(earthGroup);

        const earthGeo = new THREE.SphereGeometry(20, 64, 64);
        const earthMat = new THREE.MeshStandardMaterial({ 
            map: createEarthTexture(), roughness: 0.6, metalness: 0.1 
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earthGroup.add(earth);
        floaters.push({obj: earth, type: 'rotate', x: 0, y: 0.002});

        // Pin for Gujarat
        const pinGroup = new THREE.Group();
        const pinGeo = new THREE.ConeGeometry(0.5, 2, 16);
        const pinMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.2 });
        const pin = new THREE.Mesh(pinGeo, pinMat);
        pin.rotation.x = Math.PI / 2;
        pin.position.z = 21; // sit on surface
        pinGroup.add(pin);
        
        // Approximate Lat/Lon mapped to rotation
        pinGroup.rotation.y = (73 * Math.PI) / 180;
        pinGroup.rotation.x = -(23.8 * Math.PI) / 180;
        earthGroup.add(pinGroup);

        // Sun light for earth
        const earthSun = new THREE.DirectionalLight(0xffffff, 2);
        earthSun.position.set(50, 20, 150);
        scene.add(earthSun);


        // ----------------------------------------------------------
        // ZONE 2: THE BUSINESS CARD (z = 40)
        // ----------------------------------------------------------
        const cardGroup = new THREE.Group();
        cardGroup.position.set(0, 0, 40);
        scene.add(cardGroup);

        const cardW = 16, cardH = 9;
        const cardGeo = new THREE.BoxGeometry(cardW, cardH, 0.1);
        
        const matCardFront = new THREE.MeshStandardMaterial({ map: createCardTexture(true), roughness: 0.4 });
        const matCardBack = new THREE.MeshStandardMaterial({ map: createCardTexture(false), roughness: 0.4 });
        const matCardEdge = new THREE.MeshStandardMaterial({ color: 0xffffff });
        
        const card = new THREE.Mesh(cardGeo, [matCardEdge, matCardEdge, matCardEdge, matCardEdge, matCardFront, matCardBack]);
        card.castShadow = true;
        cardGroup.add(card);
        floaters.push({obj: cardGroup, type: 'float', amp: 0.5, speed: 2});


        // ----------------------------------------------------------
        // ZONE 3: THE SHOP INTERIOR (z = 0 to -200)
        // ----------------------------------------------------------
        const shopGroup = new THREE.Group();
        scene.add(shopGroup);

        // 1. Architecture (Floor, Walls, Ceiling)
        const floorGeo = new THREE.PlaneGeometry(60, 250);
        const floorMat = new THREE.MeshStandardMaterial({ map: createFloorTexture(), roughness: 0.1, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, -10, -100);
        floor.receiveShadow = true;
        shopGroup.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfffae6, roughness: 0.9 }); // Warm off-white
        
        const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(250, 40), wallMat);
        wallLeft.rotation.y = Math.PI / 2;
        wallLeft.position.set(-25, 10, -100);
        wallLeft.receiveShadow = true;
        shopGroup.add(wallLeft);

        const wallRight = new THREE.Mesh(new THREE.PlaneGeometry(250, 40), wallMat);
        wallRight.rotation.y = -Math.PI / 2;
        wallRight.position.set(25, 10, -100);
        wallRight.receiveShadow = true;
        shopGroup.add(wallRight);

        const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(50, 40), wallMat);
        wallBack.position.set(0, 10, -225);
        wallBack.receiveShadow = true;
        shopGroup.add(wallBack);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(60, 250), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 1}));
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(0, 30, -100);
        shopGroup.add(ceiling);

        // 2. Shop Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // soft fill
        shopGroup.add(ambientLight);

        // Main sunlight streaming in from the entrance
        const shopSun = new THREE.DirectionalLight(0xfff5b6, 1.5); // warm sunlight
        shopSun.position.set(0, 20, 20);
        shopSun.target.position.set(0, 0, -100);
        shopSun.castShadow = true;
        shopSun.shadow.camera.near = 0.5;
        shopSun.shadow.camera.far = 300;
        shopSun.shadow.camera.left = -30;
        shopSun.shadow.camera.right = 30;
        shopSun.shadow.camera.top = 100;
        shopSun.shadow.camera.bottom = -20;
        shopSun.shadow.mapSize.width = 2048;
        shopSun.shadow.mapSize.height = 2048;
        shopGroup.add(shopSun);
        shopGroup.add(shopSun.target);

        // Interior Overhead Lights (LED Panels)
        for(let z = -20; z >= -200; z -= 40) {
            const pointLight = new THREE.PointLight(0xffffff, 0.8, 100);
            pointLight.position.set(0, 28, z);
            shopGroup.add(pointLight);
            
            // Visual LED fixture
            const fixture = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 2), new THREE.MeshBasicMaterial({color: 0xffffff}));
            fixture.position.set(0, 29.5, z);
            shopGroup.add(fixture);
        }

        // --- HELPER FUNCTION TO BUILD SHELVES ---
        function createShelf(x, z, width, shelvesCount) {
            const shelfGroup = new THREE.Group();
            shelfGroup.position.set(x, -10, z); // start at floor
            
            // Side panels
            const sideGeo = new THREE.BoxGeometry(4, 25, 0.5);
            const leftPanel = new THREE.Mesh(sideGeo, matWood);
            leftPanel.position.set(-width/2, 12.5, 0); leftPanel.castShadow = true; leftPanel.receiveShadow = true;
            const rightPanel = leftPanel.clone();
            rightPanel.position.set(width/2, 12.5, 0);
            shelfGroup.add(leftPanel, rightPanel);

            // Horizontal planks
            for(let i=0; i<shelvesCount; i++) {
                const plank = new THREE.Mesh(new THREE.BoxGeometry(width, 0.5, 4), matWood);
                plank.position.set(0, 2 + (i * (25/shelvesCount)), 0);
                plank.castShadow = true; plank.receiveShadow = true;
                shelfGroup.add(plank);
            }
            return shelfGroup;
        }

        // 3. Populate Left Wall (TVs)
        const screens = [
            createScreenTexture('#ff0055', '#ffaa00'),
            createScreenTexture('#0055ff', '#00ffaa'),
            createScreenTexture('#aa00ff', '#ff00aa')
        ];

        for(let z = -30; z >= -180; z -= 30) {
            const shelf = createShelf(-24, z, 20, 3);
            shelf.rotation.y = Math.PI / 2;
            shopGroup.add(shelf);

            // Add TVs to shelves
            for(let i=0; i<3; i++) {
                const tvH = 2 + (i * 8.3); // Y pos on shelf
                const tvGroup = new THREE.Group();
                tvGroup.position.set(-22, -10 + tvH + 2, z); // x offset slightly off wall
                tvGroup.rotation.y = Math.PI / 2;
                
                const frame = new THREE.Mesh(new THREE.BoxGeometry(14, 8, 0.5), matPlasticBlack);
                frame.castShadow = true;
                
                const screenMat = new THREE.MeshBasicMaterial({ map: screens[(z+i)%3] }); // Basic mat emits light
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(13.5, 7.5), screenMat);
                screen.position.z = 0.26;
                
                tvGroup.add(frame, screen);
                shopGroup.add(tvGroup);
            }
        }

        // 4. Populate Right Wall (Speakers & ACs)
        for(let z = -30; z >= -180; z -= 30) {
            // AC Unit high up on the wall
            const acGroup = new THREE.Group();
            acGroup.position.set(24, 20, z);
            acGroup.rotation.y = -Math.PI / 2;
            
            const acBody = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 3), matPlasticWhite);
            acBody.castShadow = true; acBody.receiveShadow = true;
            const acVent = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, 0.5), matPlasticBlack);
            acVent.position.set(0, -1, 1.3);
            acGroup.add(acBody, acVent);
            shopGroup.add(acGroup);

            // Speakers on the floor
            for(let i = -1; i <= 1; i+=2) {
                const spk = new THREE.Mesh(new THREE.BoxGeometry(3, 12, 4), matWood);
                spk.position.set(22, -4, z + (i*6));
                spk.rotation.y = -Math.PI / 2;
                spk.castShadow = true; spk.receiveShadow = true;
                
                // Cones
                const coneGeo = new THREE.CylinderGeometry(1, 1, 0.2, 16);
                for(let y of [-3, 0, 3]) {
                    const cone = new THREE.Mesh(coneGeo, matPlasticBlack);
                    cone.rotation.x = Math.PI / 2;
                    cone.position.set(0, y, 2.1);
                    spk.add(cone);
                }
                shopGroup.add(spk);
            }
        }

        // 5. Center Glass Counters (Mobiles / Smartwatches)
        for(let z = -50; z >= -150; z -= 35) {
            const counterGroup = new THREE.Group();
            counterGroup.position.set(0, -10, z);
            
            // Wooden Base
            const base = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 8), matWood);
            base.position.y = 3;
            base.castShadow = true; base.receiveShadow = true;
            counterGroup.add(base);

            // Glass Top
            const glassTop = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 8), matGlass);
            glassTop.position.y = 8;
            glassTop.castShadow = true;
            counterGroup.add(glassTop);

            // Phones inside glass
            for(let x=-4; x<=4; x+=2) {
                for(let dz=-2; dz<=2; dz+=2) {
                    const phone = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 1.6), new THREE.MeshStandardMaterial({color: 0x444444, metalness: 0.8, roughness: 0.2}));
                    phone.position.set(x, 6.2, dz);
                    counterGroup.add(phone);
                }
            }
            shopGroup.add(counterGroup);
        }


        // ==========================================================
        // 4. GSAP SCROLLTIMELINE & CAMERA CHOREOGRAPHY
        // ==========================================================
        gsap.registerPlugin(ScrollTrigger);

        // Initial Setup
        camera.position.set(0, 0, 160); // Start far back looking at Earth

        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "#scroll-proxy",
                start: "top top",
                end: "bottom bottom",
                scrub: 1,
                onUpdate: updateUI
            }
        });

        // STAGE 1: Zoom to Earth / India (0% - 15%)
        tl.to(camera.position, { z: 108, ease: "power1.inOut", duration: 10 }, 0);
        tl.to(earthGroup.rotation, { x: 0.2, y: -0.5, ease: "power1.inOut", duration: 10 }, 0); // Rotate towards pin

        // STAGE 2: Transition to Business Card (15% - 20%)
        // Rapid jump of camera to view the card, hiding earth behind
        tl.to(camera.position, { z: 65, ease: "power2.inOut", duration: 5 }, 10);
        
        // STAGE 3: Examine Business Card (20% - 35%)
        tl.to(cardGroup.rotation, { y: Math.PI, ease: "power1.inOut", duration: 8 }, 15); // Flip to back
        tl.to(cardGroup.rotation, { y: Math.PI * 2, ease: "power1.inOut", duration: 7 }, 23); // Flip to front again

        // STAGE 4: Enter the Shop (35% - 45%)
        // Fly through/past the card and into the doorway
        tl.to(camera.position, { z: -10, y: -2, ease: "power2.in", duration: 10 }, 30);
        tl.to(cardGroup.position, { y: 20, ease: "power1.in", duration: 5 }, 35); // move card up out of way

        // STAGE 5: Walk down the aisle (45% - 100%)
        tl.to(camera.position, { z: -190, ease: "none", duration: 60 }, 40);
        
        // Add subtle looking left/right while walking
        tl.to(camera.rotation, { y: 0.3, ease: "sine.inOut", duration: 10 }, 45); // Look left at TVs
        tl.to(camera.rotation, { y: -0.3, ease: "sine.inOut", duration: 15 }, 60); // Look right at Speakers
        tl.to(camera.rotation, { y: 0.1, ease: "sine.inOut", duration: 10 }, 80); // Look towards center counter
        tl.to(camera.rotation, { y: 0, ease: "sine.inOut", duration: 5 }, 95); // Face forward at end


        // ==========================================================
        // 5. UI UPDATES
        // ==========================================================
        const progressBar = document.getElementById('progress-bar');
        const scrollPrompt = document.getElementById('scroll-prompt');
        const contextPanel = document.getElementById('context-panel');
        const contextTitle = document.getElementById('context-title');
        const contextDesc = document.getElementById('context-desc');

        function updateUI(self) {
            const p = self.progress;
            progressBar.style.width = `${p * 100}%`;

            // Fade out scroll prompt
            if (p > 0.02 && scrollPrompt.style.opacity !== '0') {
                gsap.to(scrollPrompt, {opacity: 0, duration: 0.5});
            }

            // Update Context Panel based on scroll journey
            if (p < 0.15) {
                contextPanel.style.opacity = '0';
            } 
            else if (p >= 0.15 && p < 0.35) {
                contextPanel.style.opacity = '1';
                contextTitle.innerText = "Digital Business Card";
                contextDesc.innerText = "Authorized Retailer";
            }
            else if (p >= 0.35 && p < 0.5) {
                contextPanel.style.opacity = '1';
                contextTitle.innerText = "Store Entrance";
                contextDesc.innerText = "Welcome Inside";
            }
            else if (p >= 0.5 && p < 0.65) {
                contextTitle.innerText = "Visual Displays";
                contextDesc.innerText = "Smart TVs & Monitors";
            }
            else if (p >= 0.65 && p < 0.85) {
                contextTitle.innerText = "Home Appliances & Audio";
                contextDesc.innerText = "ACs, Coolers & Speakers";
            }
            else if (p >= 0.85) {
                contextTitle.innerText = "Personal Tech";
                contextDesc.innerText = "Mobiles & Smartwatches";
            }
        }

        // ==========================================================
        // 6. ANIMATION RENDER LOOP
        // ==========================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Handle ambient floaters/rotations
            floaters.forEach(f => {
                if(f.type === 'rotate') {
                    f.obj.rotation.x += f.x;
                    f.obj.rotation.y += f.y;
                } else if(f.type === 'float') {
                    f.obj.position.y = Math.sin(time * f.speed) * f.amp;
                }
            });

            // Very subtle camera bobbing for realistic walking feel when inside shop
            if (camera.position.z < 0) {
                camera.position.y = -2 + Math.sin(time * 3) * 0.2;
            }

            renderer.render(scene, camera);
        }
        animate();

        // ==========================================================
        // 7. RESIZE HANDLER
        // ==========================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
